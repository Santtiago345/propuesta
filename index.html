<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Para Juanita ✨</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #fce4ec 0%, #e1bee7 30%, #d1c4e9 60%, #fff9c4 100%);
      background-size: 400% 400%;
      animation: gradientShift 12s ease infinite;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(3deg); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(147, 51, 234, 0.4); }
      50% { box-shadow: 0 0 0 20px rgba(147, 51, 234, 0); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .animate-fade-in {
      animation: fadeInUp 1s ease forwards;
    }

    .delay-1 { animation-delay: 0.2s; opacity: 0; }
    .delay-2 { animation-delay: 0.5s; opacity: 0; }
    .delay-3 { animation-delay: 0.8s; opacity: 0; }
    .delay-4 { animation-delay: 1.1s; opacity: 0; }

    .btn-propuesta {
      background: linear-gradient(135deg, #9333ea, #7c3aed, #6d28d9);
      transition: all 0.3s ease;
    }

    .btn-propuesta:hover {
      transform: scale(1.08);
      animation: pulse 2s infinite;
    }

    .star {
      position: absolute;
      font-size: 24px;
      pointer-events: none;
      animation: float 4s ease-in-out infinite, twinkle 2s ease-in-out infinite;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen relative overflow-hidden">

  <!-- Estrellas decorativas -->
  <span class="star" style="top:8%;left:10%;animation-delay:0s;">✨</span>
  <span class="star" style="top:15%;right:12%;animation-delay:0.5s;">💫</span>
  <span class="star" style="top:60%;left:5%;animation-delay:1s;">🌟</span>
  <span class="star" style="top:70%;right:8%;animation-delay:1.5s;">✨</span>
  <span class="star" style="top:25%;left:20%;animation-delay:0.3s;">💖</span>
  <span class="star" style="top:40%;right:20%;animation-delay:1.2s;">💫</span>
  <span class="star" style="top:80%;left:50%;animation-delay:0.7s;">🌟</span>
  <span class="star" style="top:10%;left:70%;animation-delay:1.8s;">✨</span>
  <span class="star" style="top:50%;left:85%;animation-delay:0.4s;">💖</span>

  <!-- Contenido principal -->
  <div class="z-10 text-center px-4">
    <h1 class="animate-fade-in delay-1 text-4xl md:text-6xl font-bold text-purple-800 mb-3">
      Hola Juanita 💜
    </h1>
    <p class="animate-fade-in delay-2 text-lg md:text-xl text-purple-600 mb-10 max-w-md mx-auto">
      Tengo algo especial preparado para ti...
    </p>

    <div class="animate-fade-in delay-3 flex flex-col sm:flex-row gap-4 justify-center items-center">
      <a href="propuesta.html" class="btn-propuesta text-white px-10 py-4 rounded-full text-xl font-semibold shadow-lg no-underline inline-block">
        Propuesta 💍
      </a>
      <a href="libro.html" class="bg-purple-400 text-white px-10 py-4 rounded-full text-xl font-semibold shadow-lg hover:bg-purple-500 transition transform hover:scale-105 no-underline inline-block">
        Libro 📖
      </a>
    </div>

    <p class="animate-fade-in delay-4 text-sm text-purple-400 mt-12">
      Hecho con mucho amor para ti 💕
    </p>
  </div>

  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
