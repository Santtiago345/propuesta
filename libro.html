<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nuestra Historia 📖</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="libro.css" />
</head>
<body>

  <a href="index.html" class="fixed top-4 left-4 z-50 bg-white bg-opacity-80 text-purple-700 px-4 py-2 rounded-full text-sm font-semibold shadow hover:bg-purple-100 transition no-underline">
    ← Inicio
  </a>

  <div class="book-scene">

    <!-- ====== LIBRO CERRADO (PORTADA) ====== -->
    <div class="book-closed" id="bookClosed">
      <div class="book-3d">
        <div class="book-spine"></div>
        <div class="book-cover-front">
          <div class="cover-inner">
            <div class="cover-ornament">✦ ✦ ✦</div>
            <h1 class="cover-title">Nuestra<br>Historia</h1>
            <div class="cover-divider"></div>
            <p class="cover-sub">Un libro para ti, Juanita 💜</p>
            <button class="btn-open" id="btnOpen" onclick="Libro.abrir()">Abrir libro ✨</button>
          </div>
        </div>
        <div class="book-pages-edge"></div>
        <div class="book-back"></div>
      </div>
    </div>

    <!-- ====== LIBRO ABIERTO ====== -->
    <div class="book-open hidden" id="bookOpen">
      
      <!-- Página izquierda -->
      <div class="page page-left" id="pageLeft">
        <div class="page-inner"></div>
      </div>

      <!-- Página derecha con flip -->
      <div class="page page-right" id="pageRight">
        <div class="page-flip-container" id="flipContainer">
          <div class="page-flip-front" id="flipFront">
            <div class="page-inner"></div>
          </div>
          <div class="page-flip-back" id="flipBack">
            <div class="page-inner"></div>
          </div>
        </div>
      </div>

      <!-- Botones de navegación -->
      <button class="nav-arrow nav-prev" id="navPrev" onclick="Libro.anterior()" title="Anterior">❮</button>
      <button class="nav-arrow nav-next" id="navNext" onclick="Libro.siguiente()" title="Siguiente">❯</button>

      <!-- Botón índice -->
      <button class="nav-index-btn" id="navIndex" onclick="Libro.irAIndice()" title="Índice">📑</button>

      <!-- Indicador -->
      <div class="page-label" id="pageLabel">1 / 6</div>

    </div>
  </div>

  <script src="libro.js"></script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
