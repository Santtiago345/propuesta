<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nuestra Historia 📖</title>
  <link rel="stylesheet" href="libro.css" />
</head>
<body>

  <a href="index.html" class="top-back-link">← Inicio</a>

  <!-- CONTENEDOR PRINCIPAL -->
  <div class="flipbook-scene" id="scene">

    <!-- LIBRO CERRADO (PORTADA) -->
    <div class="book-closed-wrap" id="bookClosedWrap">
      <div class="book-3d-closed">
        <div class="book-spine-3d"></div>
        <div class="book-cover-3d" id="bookCover3d">
          <div class="cover-pattern"></div>
          <div class="cover-content">
            <div class="cover-stars">✦ ✦ ✦ ✦ ✦</div>
            <h1 class="cover-main-title">Nuestra<br>Historia</h1>
            <div class="cover-line"></div>
            <p class="cover-subtitle">Un libro para ti, Juanita 💜</p>
            <button class="cover-open-btn" id="btnOpenBook">Abrir libro ✨</button>
          </div>
        </div>
        <div class="book-pages-stack"></div>
      </div>
    </div>

    <!-- LIBRO ABIERTO -->
    <div class="book-container" id="bookContainer">
      
      <!-- Sombra inferior -->
      <div class="book-shadow"></div>

      <!-- Lomo -->
      <div class="book-binding"></div>

      <!-- PÁGINA IZQUIERDA -->
      <div class="page-left-side" id="pageLeftSide">
        <div class="page-left-content" id="pageLeftContent"></div>
      </div>

      <!-- LADO DERECHO (contiene la pila de hojas) -->
      <div class="page-right-side" id="pageRightSide">
        <!-- Hojas apiladas visibles desde el borde -->
        <div class="sheets-stack" id="sheetsStack"></div>
        <!-- Hoja actual (la que se voltea) -->
        <div class="sheet-flipper" id="sheetFlipper">
          <div class="sheet-front" id="sheetFront">
            <div class="sheet-content" id="sheetFrontContent"></div>
          </div>
          <div class="sheet-back" id="sheetBack">
            <div class="sheet-content" id="sheetBackContent"></div>
          </div>
        </div>
        <!-- Sombra de la hoja al voltear -->
        <div class="flip-shadow" id="flipShadow"></div>
      </div>

      <!-- Controles -->
      <button class="ctrl-btn ctrl-prev" id="ctrlPrev" title="Anterior">❮</button>
      <button class="ctrl-btn ctrl-next" id="ctrlNext" title="Siguiente">❯</button>
      <button class="ctrl-btn ctrl-toc" id="ctrlToc" title="Índice">☰</button>
      <button class="ctrl-btn ctrl-zoom" id="ctrlZoom" title="Pantalla completa">⛶</button>

      <!-- Indicador de página -->
      <div class="page-counter" id="pageCounter">1 / 8</div>

      <!-- Panel de Índice (overlay) -->
      <div class="toc-overlay" id="tocOverlay">
        <div class="toc-panel">
          <div class="toc-header">
            <h2>📑 Índice</h2>
            <button class="toc-close" id="tocClose">✕</button>
          </div>
          <div class="toc-list" id="tocList"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="libro.js"></script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
