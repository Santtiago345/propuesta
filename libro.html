<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Nuestra Historia</title>
  <link rel="stylesheet" href="libro.css" />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet" />
</head>

<body>

  <a href="index.html" class="top-back-link">← Inicio</a>
  <div class="loader" id="loader">Cargando libro...</div>

  <div class="flipbook-scene" id="scene">

    <div class="book-wrapper" id="bookWrapper">

      <!-- 0: Portada (hard) -->
      <div class="book-page cover-page">
        <div class="cover-deco">
          <h1 class="cover-main-title">...<br></h1>
          <div class="cover-line"></div>
          <p class="cover-subtitle"></p>
        </div>
      </div>

      <!-- 1-3: Blancos -->
      <div class="book-page blank-page"></div>
      <div class="book-page blank-page"></div>
      <div class="book-page blank-page"></div>

      <!-- 4: Titulo -->
      <div class="book-page title-page">
        <div class="title-deco">
          <h1 class="title-main">Nuestra Historia</h1>
          <div class="title-line"></div>
          <p class="title-author">Escrito para Juanita</p>
          <p class="title-year">2025</p>
        </div>
      </div>

      <!-- 5: Blanco -->
      <div class="book-page blank-page"></div>

      <!-- 6: Agradecimientos -->
      <div class="book-page">
        <div class="page-hdr">
          <span class="hdr-left">6</span>
          <span class="hdr-center">Agradecimientos</span>
          <span class="hdr-right">6</span>
        </div>
        <div class="page-content">
          <p>En construccion.</p>
        </div>
      </div>

      <!-- 7: Blanco -->
      <div class="book-page blank-page"></div>

      <!-- 8: Indice -->
      <div class="book-page">
        <div class="page-hdr">
          <span class="hdr-left">8</span>
          <span class="hdr-center">Indice</span>
          <span class="hdr-right">8</span>
        </div>
        <div class="page-content">
          <div class="toc-profesional" id="tocProfesional"></div>
        </div>
      </div>

      <!-- 9: Blanco -->
      <div class="book-page blank-page"></div>

      <!-- 10+: Introduccion (generado dinamicamente) -->
      <!-- Las paginas de introduccion se insertan aqui via JS -->

      <!-- Paginas de capitulos fijos (se insertan despues via JS) -->

      <!-- Ultima: Contraportada (hard) -->
      <div class="book-page cover-page" id="backCoverPage">
        <div class="cover-deco">
          <h2
            style="color:#fff;font-size:1.6rem;margin-bottom:1rem;border-bottom:2px solid rgba(255,215,0,0.5);padding-bottom:0.5rem">
          </h2>
          <p style="color:rgba(255,255,255,0.9);font-size:1.1rem;margin-bottom:0.5rem"></p>
          <p style="color:rgba(255,255,255,0.8)">Si el amor todo lo puede, <br>porque no habria de poder escribirte un
            libro?</p>
          <a href="index.html" class="end-btn">Volver al inicio</a>
        </div>
      </div>

    </div>

    <button class="ctrl ctrl-prev" id="ctrlPrev" title="Anterior">&#10094;</button>
    <button class="ctrl ctrl-next" id="ctrlNext" title="Siguiente">&#10095;</button>
    <button class="ctrl ctrl-toc" id="ctrlToc" title="Indice">&#9776;</button>
    <button class="ctrl ctrl-dev" id="ctrlDev" title="Modo desarrollador">&#9998;</button>

    <div class="page-indicator" id="pageIndicator">Portada</div>

    <div class="toc-overlay" id="tocOverlay">
      <div class="toc-panel">
        <div class="toc-bar">
          <h2>Indice</h2>
          <button class="toc-close" id="tocClose">&#10005;</button>
        </div>
        <div class="toc-body" id="tocBody"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <audio id="bgAudio" src="this-is-home.mp3" preload="auto" style="display:none"></audio>
  <script src="libro.js"></script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>

</html>
