<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tests - Flipbook</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a0a2e; color: #e2e8f0;
      min-height: 100vh;
    }
    .container { max-width: 800px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { text-align: center; color: #c084fc; }
    .sub { text-align: center; color: #a78bfa; margin-bottom: 1.5rem; font-size: 0.9rem; }
    .tests { display: flex; flex-direction: column; gap: 8px; }
    .test {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; padding: 14px 18px;
      display: flex; align-items: center; gap: 12px;
    }
    .icon {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; flex-shrink: 0;
    }
    .icon.pending { background: rgba(148,163,184,0.2); }
    .icon.pass { background: rgba(34,197,94,0.25); }
    .icon.fail { background: rgba(239,68,68,0.25); }
    .name { flex: 1; font-size: 0.9rem; }
    .msg { font-size: 0.78rem; color: #94a3b8; }
    .summary {
      margin-top: 2rem; padding: 1.5rem;
      background: rgba(255,255,255,0.08); border-radius: 12px; text-align: center;
    }
    .summary.ok { border: 2px solid rgba(34,197,94,0.4); }
    .summary.fail { border: 2px solid rgba(239,68,68,0.4); }
    .btn {
      display: block; margin: 0 auto 1rem;
      padding: 12px 36px; border-radius: 50px;
      background: linear-gradient(135deg, #7c3aed, #9333ea); color: #fff;
      border: none; font-size: 1rem; font-weight: bold;
      cursor: pointer; transition: 0.3s;
    }
    .btn:hover:not(:disabled) { transform: scale(1.05); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .back {
      background: rgba(255,255,255,0.1); color: #c084fc;
      text-decoration: none; display: inline-block;
      padding: 8px 20px; border-radius: 50px; font-size: 0.85rem; margin-bottom: 1rem;
    }
    .bar {
      width: 100%; height: 4px; background: rgba(255,255,255,0.1);
      border-radius: 2px; margin: 1rem 0; overflow: hidden;
    }
    .bar-fill {
      height: 100%; background: linear-gradient(90deg, #7c3aed, #a78bfa);
      border-radius: 2px; transition: width 0.5s;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="libro.html" class="back">← Volver al libro</a>
    <h1>🧪 Pruebas del Flipbook</h1>
    <p class="sub">Verificación automática con StPageFlip</p>

    <button class="btn" id="btnRun" onclick="run()" disabled>Cargando...</button>
    <div class="bar"><div class="bar-fill" id="bar" style="width:0%"></div></div>
    <div class="tests" id="tests"></div>
    <div class="summary" id="summary" style="display:none"></div>
  </div>

  <iframe id="frame" src="libro.html" style="width:1px;height:1px;position:absolute;opacity:0" onload="onLoad()"></iframe>

  <script>
    var FB = null;
    var list = [];
    var results = [];
    var total = 0;

    function delay(ms) { return new Promise(function(r){setTimeout(r,ms);}); }

    function waitFB() {
      return new Promise(function(resolve) {
        var max = 12000, start = Date.now();
        function chk() {
          try {
            var w = document.getElementById('frame').contentWindow;
            if (w && w.Flipbook && w.Flipbook.isReady && w.Flipbook.isReady()) {
              FB = w.Flipbook; resolve(true); return;
            }
          } catch(e) {}
          if (Date.now() - start > max) { resolve(false); return; }
          setTimeout(chk, 200);
        }
        chk();
      });
    }

    function onLoad() {
      waitFB().then(function(ok) {
        var btn = document.getElementById('btnRun');
        if (ok) { btn.textContent = 'Ejecutar pruebas ▶'; btn.disabled = false; }
        else { btn.textContent = 'Error de carga'; }
        buildList();
      });
    }

    function buildList() {
      list = [
        { name: '1. El flipbook está listo', msg: 'isReady() debe devolver true',
          fn: function() { return FB && FB.isReady(); } },
        { name: '2. Inicia en la portada (página 0)', msg: 'getCurrentPage() debe ser 0',
          fn: function() { return FB.getCurrentPage() === 0; } },
        { name: '3. Hay 9 páginas en total', msg: 'getTotalPages() debe ser 9',
          fn: function() { return FB.getTotalPages() === 9; } },
        { name: '4. Avanzar a página 2 (índice + cap1)', msg: 'Flip a spread con índice',
          fn: function() { FB.goToPage(2); return true; }, wait: 1100 },
        { name: '5. Verificar página 2', msg: 'getCurrentPage() debe ser 2',
          fn: function() { return FB.getCurrentPage() === 2; } },
        { name: '6. Avanzar a página 4', msg: 'Flip a segundo spread',
          fn: function() { FB.goToPage(4); return true; }, wait: 1100 },
        { name: '7. Verificar página 4', msg: 'getCurrentPage() debe ser 4',
          fn: function() { return FB.getCurrentPage() === 4; } },
        { name: '8. Avanzar a página 6', msg: 'Flip a tercer spread',
          fn: function() { FB.goToPage(6); return true; }, wait: 1100 },
        { name: '9. Verificar página 6', msg: 'getCurrentPage() debe ser 6',
          fn: function() { return FB.getCurrentPage() === 6; } },
        { name: '10. Avanzar a página 8 (contraportada)', msg: 'Flip al final',
          fn: function() { FB.goToPage(8); return true; }, wait: 1100 },
        { name: '11. Verificar última página', msg: 'getCurrentPage() debe ser 8',
          fn: function() { return FB.getCurrentPage() === 8; } },
        { name: '12. Volver a la portada', msg: 'goToPage(0) debe funcionar',
          fn: function() { FB.goToPage(0); return true; }, wait: 1100 },
        { name: '13. Verificar portada de nuevo', msg: 'getCurrentPage() debe ser 0',
          fn: function() { return FB.getCurrentPage() === 0; } },
        { name: '14. flipNext funciona', msg: 'Avanzar con flecha',
          fn: function() { FB.flipNext(); return true; }, wait: 1100 },
        { name: '15. Verificar tras flipNext', msg: 'getCurrentPage() debe ser > 0',
          fn: function() { return FB.getCurrentPage() > 0; } },
        { name: '16. flipPrev funciona', msg: 'Retroceder con flecha',
          fn: function() { FB.flipPrev(); return true; }, wait: 1100 },
        { name: '17. Verificar tras flipPrev', msg: 'getCurrentPage() debe ser 0',
          fn: function() { return FB.getCurrentPage() === 0; } },
        { name: '18. Sin crashes con páginas inválidas', msg: 'goToPage(-1) y goToPage(99) no crashean',
          fn: function() {
            try { FB.goToPage(-1); FB.goToPage(99); return true; }
            catch(e) { return false; }
          }}
      ];
      total = list.length;
      renderList();
    }

    function renderList() {
      var d = document.getElementById('tests');
      d.innerHTML = '';
      list.forEach(function(t,i) {
        var div = document.createElement('div');
        div.className = 'test'; div.id = 't-'+i;
        div.innerHTML =
          '<div class="icon pending" id="ic-'+i+'">·</div>' +
          '<div><div class="name">'+t.name+'</div>' +
          '<div class="msg">'+t.msg+'</div></div>';
        d.appendChild(div);
      });
    }

    async function run() {
      document.getElementById('btnRun').disabled = true;
      results = [];

      var ok = await waitFB();
      if (!ok) {
        document.getElementById('tests').innerHTML =
          '<div class="test"><div class="icon fail">!</div>' +
          '<div><div class="name">Error</div>' +
          '<div class="msg">No se pudo acceder al libro. Abre con: npx serve .</div></div></div>';
        document.getElementById('btnRun').disabled = false;
        return;
      }

      for (var i = 0; i < list.length; i++) {
        var t = list[i];
        var passed = false;
        try { passed = t.fn(); } catch(e) { passed = false; }
        results.push({ name: t.name, passed: passed });

        var ic = document.getElementById('ic-'+i);
        var ti = document.getElementById('t-'+i);
        ic.classList.remove('pending');
        if (passed) {
          ic.classList.add('pass'); ic.textContent = '\u2713';
          ti.style.borderColor = 'rgba(34,197,94,0.4)';
        } else {
          ic.classList.add('fail'); ic.textContent = '\u2717';
          ti.style.borderColor = 'rgba(239,68,68,0.4)';
        }
        document.getElementById('bar').style.width = ((i+1)/total*100)+'%';
        if (t.wait) await delay(t.wait);
      }

      showSummary();
      document.getElementById('btnRun').disabled = false;
    }

    function showSummary() {
      var p = results.filter(function(r){return r.passed;}).length;
      var f = results.length - p;
      var ok = f === 0;
      var s = document.getElementById('summary');
      s.style.display = 'block';
      s.className = 'summary '+(ok?'ok':'fail');
      s.innerHTML =
        '<h2 style="margin:0 0 0.6rem;color:'+(ok?'#22c55e':'#ef4444')+'">'+
        (ok?'\u2705 Todo correcto':'\u274C Hay fallos')+'</h2>'+
        '<p style="margin:0;font-size:0.9rem">'+
        '<span style="color:#22c55e">\u2713 '+p+' pasaron</span> &nbsp;|&nbsp; '+
        '<span style="color:#ef4444">\u2717 '+f+' fallaron</span> &nbsp;|&nbsp; Total: '+results.length+'</p>';
    }
  </script>
</body>
</html>
